name: Terraform Review

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  terraform-review:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v4.1.0  # Explicitly use the latest version
        with:
          node-version: 24

      - name: Checkout code
        uses: actions/checkout@v4.1.1  # Latest version

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.0  # Latest version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: terraform-plan
        run: terraform plan -no-color -out=tfplan

      - name: Comment PR (if PR exists)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7.0.1  # Latest version
        with:
          script: |
            const planOutput = require('fs').readFileSync('tfplan', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => comment.user.login === 'github-actions[bot]' && comment.body.includes('Terraform Plan'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: `### Terraform Plan\n\n\`\`\`\n${planOutput}\n\`\`\``
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### Terraform Plan\n\n\`\`\`\n${planOutput}\n\`\`\``
              });
            }